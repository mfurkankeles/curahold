# Cloudflare Workers deployment. Values in <> are filled in at first deploy;
# secrets are set with `wrangler secret put NAME` and never committed.
name = "curahold"
main = "api/src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Every company lives at <slug>.curahold.com; app.curahold.com receives
# Google / Microsoft sign-in callbacks.
routes = [
  { pattern = "*.curahold.com/*", zone_name = "curahold.com" },
]

[assets]
directory = "dist/web"
not_found_handling = "single-page-application"
# The API, the AI connector and app sign-in run in the worker; everything else
# (the app, /docs/, llms.txt) is a static file.
run_worker_first = ["/api/*", "/mcp", "/oauth/*", "/.well-known/*", "/robots.txt"]

[vars]
BASE_DOMAIN = "curahold.com"
CENTRAL_HOST = "app.curahold.com"
EMAIL_FROM = "Curahold <no-reply@curahold.com>"
MAX_DEVICES = "2"
# Where help requests go. STAFF_KEY (support's entry-link key) is a secret.
SUPPORT_EMAIL = "support@curahold.com"
# Who may sign in to the support desk (desk.<domain>): the team's addresses, comma-separated.
# DESK_HOST = "desk.curahold.com"   # only to use a different host name for the desk
# SUPPORT_STAFF = ""
# Customers' portal (a second Worker, wrangler.portal.toml).
PORTAL_DOMAIN = "curahold-portal.com"

# Supabase Postgres (EU region) through Hyperdrive.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<hyperdrive-config-id>"

# Task attachments.
[[r2_buckets]]
binding = "FILES"
bucket_name = "curahold-files"

# The live channel: one Durable Object per company holds its open pages'
# WebSockets (Hibernation API: an idle connection costs nothing). SQLite-backed,
# so it runs on the free plan's Durable Objects too. See api/src/live/do.ts.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoomDO"

[[migrations]]
tag = "live-v1"
new_sqlite_classes = ["LiveRoomDO"]

# Hourly: morning summaries (in each company's time zone), scheduled
# automations, delivery retries, CRM syncs, ops alerts; clean-up once a day.
# Every 10 minutes: the AI team's clock (api/src/team/schedule.ts). It returns
# at once without ANTHROPIC_API_KEY or with TEAM_SCHEDULER = "off", and wakes
# a seat only when its cadence is due or work is queued. Cron triggers are free.
[triggers]
crons = ["0 * * * *", "*/10 * * * *"]

# Secrets: AUTH_SECRET, SECRETS_KEY, RESEND_API_KEY,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET,
# SLACK_CLIENT_ID, SLACK_CLIENT_SECRET, SLACK_SIGNING_SECRET,
# TEAMS_BOT_APP_ID, TEAMS_BOT_APP_PASSWORD, TEAMS_BOT_TENANT_ID,
# GCHAT_PROJECT_NUMBER, GCHAT_SA_EMAIL, GCHAT_SA_KEY,
# SALESFORCE_CLIENT_ID, SALESFORCE_CLIENT_SECRET, HUBSPOT_CLIENT_ID, HUBSPOT_CLIENT_SECRET,
# DYNAMICS_CLIENT_ID, DYNAMICS_CLIENT_SECRET, PIPEDRIVE_CLIENT_ID, PIPEDRIVE_CLIENT_SECRET,
# ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET (also Zoho Books),
# XERO_CLIENT_ID, XERO_CLIENT_SECRET, FREEE_CLIENT_ID, FREEE_CLIENT_SECRET, QUICKBOOKS_CLIENT_ID, QUICKBOOKS_CLIENT_SECRET
# (a service without its secrets is simply not offered; webhooks always work)
# Bot protection (SECURITY.md → Robots, scrapers and bots): TURNSTILE_SECRET_KEY is a secret;
# TURNSTILE_SITE_KEY (public) goes under [vars] once the Turnstile widget exists. Without both,
# the public forms use the honeypot + fill-time checks. ROBOT_GUARD = "strict" (default) | "crawlers" | "off";
# CRAWLERS_DOCS_AI = "allow" lets AI answer robots read /docs/ (default: blocked).
# DEMO_CRM = "1" only on the public demo.

# Salesforce extras (all optional): SALESFORCE_INSTALL_URL (the package's install link, shown before the
# first sign-in), SALESFORCE_RELAY_URL and SALESFORCE_RELAY_KEY (token renewals through tools/relay).
# ---------------------------------------------------------------- staging
# The copy everything is tried on first (docs/go-live/README.tr.md → Staging):
# its own domain (a second-level wildcard such as *.staging.curahold.com is not
# covered by Cloudflare's free certificate), its own database and bucket, no
# portal, test billing. Deploy: npx wrangler deploy --env staging
# Bindings and [vars] are not inherited by an environment, so they are repeated.
[env.staging]
name = "curahold-staging"
routes = [
  { pattern = "*.curahold-staging.com/*", zone_name = "curahold-staging.com" },
]
[env.staging.vars]
BASE_DOMAIN = "curahold-staging.com"
CENTRAL_HOST = "app.curahold-staging.com"
EMAIL_FROM = "Curahold Staging <no-reply@curahold.com>"
MAX_DEVICES = "2"
SUPPORT_EMAIL = "support@curahold.com"
PADDLE_ENV = "sandbox"
TEAM_SCHEDULER = "off"
# No portal on staging (see above): empty on purpose, read as unset (api/src/worker.ts). Without it wrangler warns
# that the top-level PORTAL_DOMAIN is not inherited (seen in `wrangler deploy --dry-run --env staging`).
PORTAL_DOMAIN = ""
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "<staging-hyperdrive-config-id>"
[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "curahold-files-staging"
[[env.staging.durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoomDO"
[env.staging.triggers]
crons = ["0 * * * *"]
