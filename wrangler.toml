# Cloudflare Workers deployment. Values in <> are filled in at first deploy;
# secrets are set with `wrangler secret put NAME` and never committed.
name = "tendwell"
main = "api/src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Every company lives at <slug>.tendwell.com; app.tendwell.com receives
# Google / Microsoft sign-in callbacks.
routes = [
  { pattern = "*.tendwell.com/*", zone_name = "tendwell.com" },
]

[assets]
directory = "dist/web"
not_found_handling = "single-page-application"
# The API, the AI connector and app sign-in run in the worker; everything else
# (the app, /docs/, llms.txt) is a static file.
run_worker_first = ["/api/*", "/mcp", "/oauth/*", "/.well-known/*"]

[vars]
BASE_DOMAIN = "tendwell.com"
CENTRAL_HOST = "app.tendwell.com"
EMAIL_FROM = "Tendwell <no-reply@tendwell.com>"
MAX_DEVICES = "2"

# Supabase Postgres (EU region) through Hyperdrive.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<hyperdrive-config-id>"

# Task attachments.
[[r2_buckets]]
binding = "FILES"
bucket_name = "tendwell-files"

# Hourly: morning summaries (in each company's time zone), scheduled
# automations, delivery retries, CRM syncs; clean-up once a day.
[triggers]
crons = ["0 * * * *"]

# Secrets: AUTH_SECRET, SECRETS_KEY, RESEND_API_KEY,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET,
# SLACK_CLIENT_ID, SLACK_CLIENT_SECRET, SLACK_SIGNING_SECRET,
# TEAMS_BOT_APP_ID, TEAMS_BOT_APP_PASSWORD, TEAMS_BOT_TENANT_ID,
# GCHAT_PROJECT_NUMBER, GCHAT_SA_EMAIL, GCHAT_SA_KEY,
# SALESFORCE_CLIENT_ID, SALESFORCE_CLIENT_SECRET, HUBSPOT_CLIENT_ID, HUBSPOT_CLIENT_SECRET,
# DYNAMICS_CLIENT_ID, DYNAMICS_CLIENT_SECRET, PIPEDRIVE_CLIENT_ID, PIPEDRIVE_CLIENT_SECRET,
# ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET
# (a service without its secrets is simply not offered; webhooks always work)
# DEMO_CRM = "1" only on the public demo.
