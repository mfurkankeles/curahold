<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
{{HEAD}}
<style>
@font-face{font-family:'Bricolage';font-weight:200 800;font-display:swap;src:url({{REL}}assets/bricolage-grotesque-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:'Bricolage';font-weight:200 800;font-display:swap;src:url({{REL}}assets/bricolage-grotesque-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-024F,U+011E-011F,U+0130-0131,U+015E-015F}
@font-face{font-family:'Figtree';font-weight:300 900;font-display:swap;src:url({{REL}}assets/figtree-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:'Figtree';font-weight:300 900;font-display:swap;src:url({{REL}}assets/figtree-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-024F,U+011E-011F,U+0130-0131,U+015E-015F}
:root{--slow:{{SLOW}};--bg:#05060c;--fg:#eef0ff;--dim:#8b8fb0;--lime:#c6ff4d;--cyan:#4de3ff;--pink:#ff5fa8;--amber:#ffb84d}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--fg);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px clamp(16px,4vw,40px)}
.logo{display:flex;align-items:center;gap:8px;font:700 18px Bricolage;margin-inline-end:auto}
.logo i{width:26px;height:26px;border-radius:50%;border:2px solid var(--lime);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--lime)}
.btn{font:700 14px Figtree;border-radius:10px;padding:10px 15px;color:var(--fg);text-decoration:none;border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.btn.solid{background:var(--lime);color:#0a0c10;border-color:var(--lime)}
.btn{display:inline-flex;align-items:center;gap:8px}.btn svg{width:15px;height:15px}[dir=rtl] .ic-dir{transform:scaleX(-1)}
.sec{position:relative}
.stick{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
h1,h2{font-family:Bricolage;font-weight:800;letter-spacing:-.045em;line-height:.95}
/* hero + orbit share one long section */
#orbit{height:calc(520svh * var(--slow))}
.title{position:absolute;top:calc(64px + 5svh);left:0;right:0;text-align:center;padding:0 20px}
.title h1{font-size:clamp(44px,8vw,112px)}
.title p{color:var(--dim);margin-top:12px;font-size:clamp(15px,1.5vw,18px)}
.planet{position:absolute;width:clamp(150px,22vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#b8ff6a 12%,#2bd6a0 38%,#0b4a5a 72%,#04121a 100%);box-shadow:0 0 120px 20px rgba(110,255,170,.25),inset -20px -30px 60px rgba(0,0,0,.6);display:grid;place-items:center;color:#04121a;font:800 clamp(16px,2vw,22px) Bricolage;will-change:transform}
.planet small{display:block;font:700 12px Figtree;text-align:center;opacity:.8}
.ellipse{position:absolute;width:min(86vw,900px);height:min(34vw,330px);border:1px dashed rgba(255,255,255,.18);border-radius:50%;will-change:transform}
.sat{position:absolute;left:50%;top:50%;width:clamp(150px,18vw,220px);margin:-60px 0 0 calc(clamp(150px,18vw,220px)/-2);padding:14px 16px;border-radius:16px;background:rgba(14,16,30,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);will-change:transform,opacity}
.sat b{display:flex;align-items:center;gap:8px;font:800 17px Bricolage}
.sat b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.sat p{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.35}
.sat .k{margin-top:10px;font:800 26px Bricolage;color:var(--c)}
.cap{position:absolute;bottom:9svh;left:0;right:0;text-align:center;padding:0 24px;font-size:clamp(18px,2.2vw,28px);font-weight:600;min-height:2.6em}
/* timeline */
#line{height:calc(300svh * var(--slow))}
.tl{position:relative;width:min(1000px,86vw);height:4px;background:rgba(255,255,255,.12);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--pink),var(--amber),var(--lime));border-radius:4px;box-shadow:0 0 18px rgba(198,255,77,.5)}
.dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#1b1e33;border:2px solid rgba(255,255,255,.3);transition:background .2s,border-color .2s,transform .2s}
.dot.on{background:var(--lime);border-color:var(--lime);transform:scale(1.25)}
.lab{position:absolute;top:28px;translate:-50% 0;width:max-content;max-width:140px;text-align:center;font-size:13px;color:var(--dim);transition:color .2s}
.lab.up{top:auto;bottom:28px}
.lab.on{color:var(--fg)}
.lab b{display:block;font:800 16px Bricolage;color:inherit}
.lhead{position:absolute;top:16svh;left:0;right:0;text-align:center;font-size:clamp(34px,6vw,84px);padding:0 20px}
/* marquee words */
#words{height:calc(220svh * var(--slow))}
.row{white-space:nowrap;font:800 clamp(64px,13vw,190px) Bricolage;letter-spacing:-.05em;line-height:1.05;will-change:transform}
.row.o{-webkit-text-stroke:1.5px rgba(255,255,255,.45);color:transparent}
.row .hl{color:var(--lime)}
/* end */
#end{height:150svh}
#end h2{font-size:clamp(44px,9vw,140px);text-align:center;padding:0 20px}
#end h2 span{color:var(--lime)}
.cta{display:flex;gap:12px;justify-content:center;margin-top:28px}
@media (max-width:700px){
  .ellipse{width:92vw;height:64vw}
  .sat{width:170px;margin-left:-85px}
  .tl{width:4px;height:62svh}
  .fill{inset:0 0 auto 0;width:auto;height:0}
  .dot{left:50%!important}
  .lab,.lab.up{left:auto!important;right:auto;top:auto;bottom:auto;translate:0 -50%;text-align:start;margin-left:22px;max-width:60vw}
  .top .btn{padding:8px 11px;font-size:13px}
}
</style>
</head>
<body>
{{HEADER}}

<section class="sec" id="orbit"><div class="stick">
  <div class="title" id="title"><h1>{{h1a}}<br>{{h1b}}</h1><p>{{sub}}</p></div>
  <div class="ellipse" id="ell"></div>
  <div class="planet" id="planet"><div>Marevo<small id="hs">{{health48}}</small></div></div>
  <div class="sat" style="--c:var(--pink)" data-i="0"><b>{{d_sales}}</b><p>{{sat0}}</p><div class="k">{{k0}}</div></div>
  <div class="sat" style="--c:var(--lime)" data-i="1"><b>{{d_cs}}</b><p>{{sat1}}</p><div class="k">{{k1}}</div></div>
  <div class="sat" style="--c:var(--cyan)" data-i="2"><b>{{d_prod}}</b><p>{{sat2}}</p><div class="k">{{k2}}</div></div>
  <div class="sat" style="--c:var(--amber)" data-i="3"><b>{{d_fin}}</b><p>{{sat3}}</p><div class="k">{{k3}}</div></div>
  <div class="cap" id="cap"></div>
</div></section>

<section class="sec" id="line"><div class="stick">
  <h2 class="lhead" id="lh">{{lineH}}</h2>
  <div class="tl" id="tl"><div class="fill" id="fill"></div></div>
</div></section>

<section class="sec" id="words"><div class="stick"><div>
  <div class="row" id="r1">{{ROW1}}</div>
  <div class="row o" id="r2">{{ROW2}}</div>
  <div class="row" id="r3">{{ROW3}}</div>
</div></div></section>

<section class="sec" id="end"><div class="stick"><div>
  <h2>{{endA}}<br><span>{{endB}}</span></h2>
  <div class="cta"><a class="btn solid" href="{{TRIAL}}" data-ab="go">{{go}}</a><a class="btn" href="{{DEMO}}" data-ab="demo">{{demo}}</a></div>
</div></div></section>
{{WHY}}
{{FOOTER}}

<script>
(() => {
  const HEALTH = {{HEALTH}}, NUM = (n) => new Intl.NumberFormat(document.documentElement.lang).format(n);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const $ = (q) => document.querySelector(q);
  let vh = innerHeight, w = innerWidth;
  addEventListener('resize', () => { if (innerWidth !== w) { w = innerWidth; vh = innerHeight; build(); } });
  const secs = [...document.querySelectorAll('.sec')];
  const shown = new Map(secs.map((s) => [s.id, 0]));
  const prog = (s) => { const r = s.getBoundingClientRect(); return clamp(-r.top / (r.height - vh)); };
  const sats = [...document.querySelectorAll('.sat')];
  const caps = {{CAPS}};
  const stops = {{STOPS}};
  const tl = $('#tl'); let dots = [], labs = [];
  const build = () => {
    tl.querySelectorAll('.dot,.lab').forEach((n) => n.remove()); dots = []; labs = [];
    const narrow = innerWidth <= 700;
    stops.forEach(([t, s], i) => {
      const f = (i + .5) / stops.length * 100;
      const d = document.createElement('div'); d.className = 'dot'; const l = document.createElement('div'); l.className = 'lab' + (i % 2 && !narrow ? ' up' : '');
      l.innerHTML = `<b>${t}</b>${s}`;
      if (narrow) { d.style.top = f + '%'; l.style.top = f + '%'; l.style.left = '50%'; } else { d.style.left = f + '%'; l.style.left = f + '%'; }
      tl.append(d, l); dots.push(d); labs.push(l);
    });
  };
  build();
  const draw = (id, p) => {
    if (id === 'orbit') {
      const narrow = innerWidth <= 700;
      const rx = Math.min(innerWidth * (narrow ? .3 : .36), 420), ry = Math.min(innerWidth * (narrow ? .3 : .14), 150);
      const intro = clamp(p / .15);
      $('#title').style.opacity = 1 - clamp((p - .08) / .1);
      $('#title').style.transform = `translateY(${-clamp((p - .08) / .1) * 40}px)`;
      $('#planet').style.transform = `scale(${.7 + intro * .3})`;
      $('#hs').textContent = HEALTH.replace('{n}', NUM(Math.round(48 + clamp((p - .6) / .35) * 37)));
      $('#ell').style.opacity = intro;
      const spin = clamp((p - .12) / .86) * Math.PI * 2;
      let front = 0, best = -9;
      sats.forEach((s, i) => {
        const a = spin + i * Math.PI / 2 + Math.PI / 2;
        const x = Math.cos(a) * rx, z = Math.sin(a), y = z * ry;
        const sc = .62 + (z + 1) * .26;
        s.style.transform = `translate(${x}px, ${y}px) scale(${sc * intro})`;
        s.style.opacity = (.25 + (z + 1) * .375) * intro;
        s.style.zIndex = Math.round((z + 1) * 10);
        if (z > best) { best = z; front = i; }
      });
      $('#cap').textContent = p > .12 ? caps[front] : '';
    } else if (id === 'line') {
      const q = clamp((p - .08) / .84);
      const narrow = innerWidth <= 700;
      $('#fill').style[narrow ? 'height' : 'width'] = q * 100 + '%';
      dots.forEach((d, i) => { const on = q >= (i + .5) / stops.length; d.classList.toggle('on', on); labs[i].classList.toggle('on', on); });
      $('#lh').style.opacity = narrow ? 1 - clamp((p - .02) / .12) * .9 : 1;
    } else if (id === 'words') {
      $('#r1').style.transform = `translateX(${10 - p * 60}%)`;
      $('#r2').style.transform = `translateX(${-50 + p * 50}%)`;
      $('#r3').style.transform = `translateX(${5 - p * 55}%)`;
    }
  };
  let raf = 0;
  const tick = () => {
    let moving = false;
    for (const s of secs) { const t = prog(s); let c = shown.get(s.id); c = reduce ? t : c + (t - c) * .14; if (Math.abs(t - c) > .0005) moving = true; else c = t; shown.set(s.id, c); draw(s.id, c); }
    raf = moving ? requestAnimationFrame(tick) : 0;
  };
  const ask = () => { if (!raf) raf = requestAnimationFrame(tick); };
  addEventListener('scroll', ask, { passive: true }); ask();
})();
</script>
{{TAIL}}
</body>
</html>
