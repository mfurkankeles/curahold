<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#191541" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191541'/%3E%3Cpath d='M20.8 10.3A7.5 7.5 0 1 0 20.8 21.7' fill='none' stroke='%23eceafe' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16.5' cy='16' r='2.6' fill='%2367c2a8'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Curahold" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Curahold</title>
    <script>
      // Light or dark before the first paint, so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('app_theme');
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
      // The first screen's first downloads start now, not after the app's code is in: the
      // company and who is signed in, and on the home screen its code and its data (each
      // answer taken once by web/src/lib/api.ts, if asked just as the app would ask), and
      // the language this browser last read in (file names from the build, above).
      try {
        var w = window, l = localStorage, p = location.pathname, h = location.hostname.split('.')[0];
        var x = JSON.parse((document.getElementById('first-screen') || {}).textContent || '{}');
        var pre = function (u) {
          var k = document.createElement('link');
          k.rel = 'modulepreload';
          k.href = u;
          document.head.appendChild(k);
        };
        if (h !== 'app' && h !== 'desk' && !/^\/(support\/enter|auth\/verify|join|signup)/.test(p) && !sessionStorage.getItem('app-preview-as')) {
          var dev = l.getItem('app_device') || '';
          var lang = l.getItem('app_locale') || l.getItem('app_locale_hint');
          var ask = function (path, loc) {
            var r = fetch('/api' + path, { headers: { 'x-curahold-device': dev, 'x-curahold-locale': loc }, credentials: 'same-origin' });
            r.catch(function () {});
            (w.__early = w.__early || {})[path] = [dev, loc, r];
            return r;
          };
          ask('/org', l.getItem('app_locale') || 'en');
          if (dev) ask('/me', l.getItem('app_locale') || 'en');
          if (x.dict && lang && x.dict[lang]) pre(x.dict[lang]);
          if (dev && (p === '/' || p === '/home')) {
            if (x.home) x.home.forEach(pre);
            ask('/me/start', lang || 'en');
            ask('/pages', lang || 'en')
              .then(function (r) { return r.ok ? r.clone().json() : null; })
              .then(function (j) { if (j && j.homeId) ask('/pages/' + j.homeId + '/data', lang || 'en'); })
              .catch(function () {});
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
