# Nightly end-to-end run in a real Chrome (built app + real API + embedded Postgres).
# Slow (several minutes) and heavier than a PR needs, so it runs on a schedule and on demand,
# not on every push. A failure opens no issue by itself: look at the run's artifacts
# (screenshots in tests/e2e/screens/) and fix forward or revert.
#
# No secrets: the stack starts its own in-memory database and fake mail.
name: Nightly e2e

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, off the hour on purpose
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # tests/e2e/browser.ts looks here first, then at the usual Linux paths.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Journeys (builds first)
        run: npm run test:e2e
      - name: In-browser demo and guided tours
        run: npm run test:demo
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: tests/e2e/screens/
          if-no-files-found: ignore
          retention-days: 7
